<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://kit.fontawesome.com/b97c950d86.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/dash.css">
  <style>
    .form-container {
      display: none;
      max-width: 650px;
      margin: auto;
      background: #fff;
      padding: 30px;
      height: 500px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      position: absolute;
      z-index: 10;
      top: 100px;
      right: 350px;

    }

    #cancel-btn {
      width: 50px;
      height: max-content;

      background-color: #2373dc;
      color: white;
      padding: 5px;
      text-align: center;
      position: relative;
      left: 400px;
    }

    #cancel-btn:hover {
      background-color: rgb(17, 54, 133);
    }

    #cancel-txt {
      padding: 0;
      margin: 0;
    }

    .edit-form-container {
      display: none;
      position: absolute;
      top: 20px;
      right: 50px;

      width: 100%;
      margin-top: 25px;
    }
  </style>
  <title>Suppliers</title>
</head>

<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-icon">
        <svg xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
          <path
            d="M32 206.1L32 544C32 561.7 46.3 576 64 576C81.7 576 96 561.7 96 544L96 304C96 286.3 110.3 272 128 272L512 272C529.7 272 544 286.3 544 304L544 544C544 561.7 558.3 576 576 576C593.7 576 608 561.7 608 544L608 206.1C608 178.6 590.4 154.1 564.2 145.4L335.2 69.1C325.3 65.8 314.7 65.8 304.8 69.1L75.8 145.4C49.6 154.1 32 178.6 32 206.1zM496 320L144 320L144 384L496 384L496 320zM144 480L496 480L496 416L144 416L144 480zM496 512L144 512L144 576L496 576L496 512z" />
        </svg>
      </div>
      <span class="brand-name">StockBridge</span>
    </div>
    <nav class="sidebar-nav">
      <p class="nav-label"> Main</p>
      <a href="./dashboard" active>
        <i class="fa-solid fa-table-cells-large"></i>
        Dashboard
      </a>
      <a href="./inventory">
        <i class="fa-solid fa-box-open"></i>
        Inventory
      </a>
      <a href="./suppliers">
        <i class="fa-solid fa-truck-field"></i>
        Suppliers
      </a>

    </nav>
    <div class="sidebar-user">
      <div id="user-info">
        <div id="user-avatar">
          A
        </div>
        <div class="user-info">
          <p id="username">Admin23</p>
          <p id="role">Admin</p>
        </div>
      </div>
    </div>
  </aside>
  <main class="main-content">

    <!-- Navbar -->
    <nav class="navbar bg-white border-bottom px-4 py-3">
      <h3 class="m-0">Suppliers Dashboard</h3>
    </nav>
    <main id="supplier-page">

      <div class="supplier-header">
        <h2>Suppliers</h2>

        <button id="add-supplier-btn">
          + Add Supplier
        </button>
      </div>
      <!-- Add Form  -->
      <div class="form-container">
        <div id="cancel-btn">
          <p id="cancel-txt">X</p>
        </div>
        <form id="supplier-form">
          <div class="form-row">

            <div class="form-group">
              <label for="supplier_name" class="Supplier name">Supplier Name</label>
              <input type="text" name="supplier" id="supplier-name" required placeholder="Enter Supplier ">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">

              <label for="supplier-tel">Phone</label>
              <input type="tel" name="" id="supplier-tel" minlength="1" maxlength="11" required
                placeholder="Enter Phone Number">
            </div>
            <div class="form-group">
              <label for="supplier-email">Email</label>
              <input type="email" name="" id="supplier-email" required placeholder="Enter Email">
            </div>
          </div>
          <div class="form-group">
            <label for="supplier-city">City</label>
            <input type="text" name="" id="supplier-city" placeholder="Enter City">
          </div>
          <div class="form-buttons">
            <button type="submit" class="save-btn" id="save">Save Product</button>
          </div>
        </form>
      </div>
      <!-- ! Edit Form -->
      <div class="edit-form-container" id="edit-form">
        <div class="product-form">
          <h2>Edit Product</h2>
          <button id="cancel-btn-1"> X</button>
          <form id="edit-Form">
            <div class="form-group">
              <label for="supplier-name">Supplier Name</label>
              <input type="text" id="edit-name" name="supplier" placeholder="Enter supplier name" required />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="phone">Phone</label>
                <input type="number" name="phone" id="edit-phone" placeholder="Enter Phone" required />
              </div>

              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="edit-email" name="email" placeholder="Enter Email" required />
              </div>
            </div>

            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="edit-city" name="city" placeholder="Enter supplier City" required />
            </div>

            <div class="form-buttons">
              <button type="submit" class="save-btn" id="edit-button">Edit Supplier</button>
              <!-- <button type="reset" class="cancel-btn">Cancel</button> -->
            </div>
            <input type="hidden" name="" id="supplier-id" disabled>
          </form>
        </div>
      </div>

      <div class="supplier-controls">

        <input type="text" id="search-supplier" placeholder="Search supplier..." onkeydown="handleSearch(event)">



        <select id="sort">
          <option selected disabled value="all">Sort by Name</option>
          <option value="Asc">A-Z</option>
          <option value="Dsc">Z-A</option>
        </select>

      </div>

      <section class="supplier-table">

        <table>

          <thead>
            <tr>

              <th>Supplier</th>
              <th>City</th>
              <th>Phone</th>
              <th>Email</th>

              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="supplier-table">
          </tbody>

        </table>

      </section>

    </main>

</body>
<script src="/js/supplier.js"></script>

</html>
